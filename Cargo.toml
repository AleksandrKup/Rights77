[package]
name = "rights77"
version = "0.3.0"
edition = "2024"
description = "Read-only viewer for 1C 7.7 users and object permissions"
repository = "https://github.com/AleksandrKup/Rights77"

[dependencies]
cfb = "0.14"
encoding_rs = "0.8"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "links"] }
rfd = "=0.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
strip = true
lto = "thin"

[build-dependencies]
winresource = "0.1.34"

[patch.crates-io]
# CoTaskMemFree is available from ole32 on Windows 7; newer bindings use combase.
windows-link = { path = "vendor/windows-link" }
